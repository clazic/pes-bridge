# 설치 시험 — macOS · Windows 에서 원클릭 설치를 시험 모드(PES_WORKER_TEST=1: 로그인 · 키 · ego lite · 자동 실행 등록 건너뜀)로 돌린다.
name: test install
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.sh (시험)
        env: { PES_WORKER_TEST: "1", PES_WORKER_SRC: "${{ github.workspace }}" }
        run: zsh ./install.sh
      - name: 확인
        run: |
          node --check ~/.pes/worker/worker/worker.mjs
          PATH="$HOME/.pes/runtime/bin:$HOME/.pes/runtime/node/bin:$HOME/.local/bin:$PATH" node ~/.pes/worker/worker/worker.mjs --check
          PATH="$HOME/.pes/runtime/bin:$HOME/.pes/runtime/node/bin:$HOME/.local/bin:$PATH" sh ~/.pes/worker/worker/tools.sh check
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: install.ps1 (시험)
        shell: powershell
        env: { PES_WORKER_TEST: "1", PES_WORKER_SRC: "${{ github.workspace }}" }
        run: .\install.ps1
      - name: 설치기 기록
        if: always()
        shell: powershell
        run: if (Test-Path "$env:TEMP\pes-tools-install.log") { Get-Content "$env:TEMP\pes-tools-install.log" -Tail 80 -Encoding UTF8 }
      - name: 확인
        shell: powershell
        run: |
          $w = Join-Path $env:USERPROFILE ".pes\worker\worker"
          node --check (Join-Path $w "worker.mjs")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path (Join-Path $w "run.vbs"))) { Write-Error "run.vbs 없음"; exit 1 }
          $st = powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $w "tools.ps1") check; $st
          if (-not ($st -match "^OK kordoc ")) { Write-Error "kordoc 설치 안 됨"; exit 1 }
          if (-not ($st -match "^OK korean-law ")) { Write-Error "korean-law 설치 안 됨"; exit 1 }
          & "$env:USERPROFILE\.pes\runtime\node\node.exe" (Join-Path $w "worker.mjs") --check
          if ($LASTEXITCODE -ne 0) { Write-Error "worker --check 실패"; exit 1 }
          $c = Get-Command claude -ErrorAction SilentlyContinue; if (-not $c) { $p = Join-Path $env:USERPROFILE ".local\bin\claude.exe"; if (-not (Test-Path $p)) { Write-Error "claude 없음"; exit 1 } }
