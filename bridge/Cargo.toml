[package]
name = "pes-bridge"
version = "0.1.0"
edition = "2024"
description = "PES 브리지(Rust) — PES 에서 일을 받아 이 컴퓨터의 AI 로 라운드를 돌리고, 조사 원본을 PES 근거 기록으로 올린다"
license = "MIT"
publish = false

[[bin]]
name = "pes-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
encoding_rs = "0.8"
futures-util = "0.3"
hex = "0.4"
p256 = { version = "0.13", features = ["ecdsa", "jwk"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
url = "2"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
axum = { version = "0.8", features = ["ws"] }
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
